services:
  postgres:
    image: postgres:17-alpine
    container_name: pg-comment-tree
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: comment-tree
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - comment-tree

  redis:
    image: redis:7-alpine
    container_name: redis-comment-tree
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    networks:
      - comment-tree

volumes:
  pgdata:

networks:
  comment-tree:
    driver: bridge
